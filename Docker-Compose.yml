services:
db:
  image: postgres:16-alpine
  environment:
    POSTGRES_DB: resume_matcher
    POSTGRES_USER: resume_user
    POSTGRES_PASSWORD: resume_pass
  ports:
    - "5432:5432"
  volumes:
    - "postgres_data:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_matcher"]
    interval: 5s
    timeout: 5s
    retries: 15

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/resume_matcher
      SPRING_DATASOURCE_USERNAME: resume_user
      SPRING_DATASOURCE_PASSWORD: resume_pass
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8080
    ports:
      

